<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map test</title>
<style>
body{font-family:system-ui,sans-serif;background:#0C0F13;color:#E4E9EF;margin:0;padding:16px;font-size:14px}
h2{font-size:15px;margin:18px 0 6px}
.box{border:1px solid #2C343E;border-radius:8px;overflow:hidden;background:#13171D}
.status{padding:8px 10px;font-size:12.5px;border-top:1px solid #2C343E}
.ok{color:#2DD4BF}.bad{color:#E5484D}
iframe{width:100%;height:260px;border:0;display:block}
img.tile{width:256px;height:256px;display:block}
code{background:#1A2029;padding:1px 5px;border-radius:3px;font-size:12px}
p{color:#8B95A5;line-height:1.5}
</style>

<h1 style="font-size:17px;margin:0 0 4px">Map test</h1>
<p style="margin:0">Open this on your Netlify URL, in a normal browser tab. Not inside Claude.</p>

<h2>1. Google Maps embed</h2>
<div class="box">
  <iframe id="g" src="https://www.google.com/maps?q=25.0801,55.1401&z=15&output=embed"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div class="status" id="gs">checking…</div>
</div>

<h2>2. OpenStreetMap tile</h2>
<div class="box">
  <img class="tile" id="t" alt="tile"
       src="https://tile.openstreetmap.org/15/20974/13697.png">
  <div class="status" id="ts">checking…</div>
</div>

<h2>3. Your connection</h2>
<div class="box"><div class="status" id="info"></div></div>

<h2>4. Your location</h2>
<div class="box">
  <div class="status" id="loc">tap below</div>
  <div class="status"><button onclick="getLoc()" style="background:#2DD4BF;border:0;color:#0A0D10;font:inherit;font-weight:600;padding:7px 12px;border-radius:6px;cursor:pointer">Get my location</button></div>
</div>

<script>
// 2 — tile load
var t = document.getElementById('t'), ts = document.getElementById('ts');
t.onload = function(){ ts.className = 'status ok'; ts.textContent = 'Tile loaded — OpenStreetMap reachable.'; };
t.onerror = function(){ ts.className = 'status bad'; ts.textContent = 'Tile BLOCKED — your network or browser is blocking tile.openstreetmap.org'; };
setTimeout(function(){
  if (ts.textContent === 'checking…') {
    ts.className = 'status bad';
    ts.textContent = 'Tile timed out — blocked or very slow connection.';
  }
}, 6000);

// 1 — the iframe cannot be inspected cross-origin, so just report what to look for
var gs = document.getElementById('gs');
gs.textContent = 'If you see a map above, Google works. If it is blank or grey, it is blocked.';

// 3 — environment
var i = document.getElementById('info');
i.innerHTML =
  'Page: <code>' + location.protocol + '//' + location.host + '</code><br>' +
  'HTTPS: ' + (location.protocol === 'https:' ? '<span class="ok">yes</span>' : '<span class="bad">NO — camera and location will not work</span>') + '<br>' +
  'Inside a frame: ' + (window.top !== window.self ? '<span class="bad">YES — you are in a preview pane, open the URL directly</span>' : '<span class="ok">no</span>') + '<br>' +
  'Online: ' + (navigator.onLine ? '<span class="ok">yes</span>' : '<span class="bad">no</span>') + '<br>' +
  'Service worker: ' + ('serviceWorker' in navigator ? 'supported' : 'not supported');

// 4 — geolocation
function getLoc(){
  var l = document.getElementById('loc');
  if (!navigator.geolocation) { l.className='status bad'; l.textContent='No geolocation on this device.'; return; }
  l.textContent = 'asking…';
  navigator.geolocation.getCurrentPosition(function(p){
    l.className = 'status ok';
    l.textContent = 'Location works: ' + p.coords.latitude.toFixed(5) + ', ' + p.coords.longitude.toFixed(5);
  }, function(e){
    l.className = 'status bad';
    l.textContent = 'Location failed: ' + e.message;
  }, { timeout: 10000 });
}
</script>
